<div>
  <mat-toolbar>
    <button matButton>
      <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="home"></mat-icon>
    </button>

    <button matButton [matMenuTriggerFor]="menuCitas" style="color: antiquewhite">Citas</button>
    <mat-menu #menuCitas="matMenu">
      <button mat-menu-item routerLink="/citas/listar">Listar</button>
      <button mat-menu-item routerLink="/citas/insertar">Insertar</button>
      <button mat-menu-item routerLink="/citas/buscar">Buscar</button>
    </mat-menu>

    <button matButton [matMenuTriggerFor]="menuPaciente" style="color: antiquewhite">
      Paciente

      <button mat-menu-item routerLink="/paciente/listar">Listar</button>
      <button mat-menu-item routerLink="/paciente/insertar">Insertar</button>
    </mat-menu>

    <button matButton [matMenuTriggerFor]="menuOftalmologo" style="color: antiquewhite">
      Oftalmologo
    </button>
    <mat-menu #menuOftalmologo="matMenu">
      <button mat-menu-item routerLink="/oftalmologo/listar">Listar</button>
      <button mat-menu-item routerLink="/oftalmologo/insertar">Insertar</button>
    </mat-menu>

    <button matButton [matMenuTriggerFor]="menuReport" style="color: antiquewhite">Reportes</button>
    <mat-menu #menuReport="matMenu">
      <button mat-menu-item routerLink="/reportes/reportecitas">Reporte citas</button>
