<div class="optic-navbar">
  <div class="brand-area" routerLink="/home">
    <mat-icon fontIcon="visibility" class="brand-icon"></mat-icon>
    <div class="brand-text">
      <span class="brand-title">OpticVision</span>
      <span class="brand-sub">SALUD VISUAL</span>
    </div>
  </div>

  <div class="nav-links">
    <button mat-button routerLink="/home" class="nav-btn home-btn">
      <mat-icon fontIcon="home"></mat-icon>
      <span>Inicio</span>
    </button>

    <button mat-button [matMenuTriggerFor]="menuCitas" class="nav-btn">Citas</button>
    <mat-menu #menuCitas="matMenu" class="optic-menu">
      <button mat-menu-item routerLink="/citas/listar">Listar</button>
      <button mat-menu-item routerLink="/citas/insertar">Insertar</button>
      <button mat-menu-item routerLink="/citas/buscar">Buscar</button>
    </mat-menu>

    <button mat-button [matMenuTriggerFor]="menuPaciente" class="nav-btn">Paciente</button>
    <mat-menu #menuPaciente="matMenu" class="optic-menu">
      <button mat-menu-item routerLink="/paciente/listar">Listar</button>
      <button mat-menu-item routerLink="/paciente/insertar">Insertar</button>
    </mat-menu>

    <button mat-button [matMenuTriggerFor]="menuOftalmologo" class="nav-btn">Oftalmólogo</button>
    <mat-menu #menuOftalmologo="matMenu">
      <button mat-menu-item routerLink="/oftalmologo/listar">Listar</button>
      <button mat-menu-item routerLink="/oftalmologo/insertar">Insertar</button>
    </mat-menu>

    <button mat-button [matMenuTriggerFor]="menuIntervencion" class="nav-btn">Intervención</button>
    <mat-menu #menuIntervencion="matMenu">
      <button mat-menu-item routerLink="/intervencion/listar">Listar</button>
      <button mat-menu-item routerLink="/intervencion/insertar">Insertar</button>
    </mat-menu>

    <button mat-button [matMenuTriggerFor]="menuTratamiento" class="nav-btn">Tratamiento</button>
    <mat-menu #menuTratamiento="matMenu">
      <button mat-menu-item routerLink="/tratamiento/listar">Listar</button>
      <button mat-menu-item routerLink="/tratamiento/insertar">Insertar</button>
    </mat-menu>

    <button mat-button [matMenuTriggerFor]="menuRecetas" class="nav-btn">Recetas</button>
    <mat-menu #menuRecetas="matMenu">
      <button mat-menu-item routerLink="/recetas/listar">Listar</button>
      <button mat-menu-item routerLink="/recetas/insertar">Insertar</button>
    </mat-menu>

    <button mat-button [matMenuTriggerFor]="menuLentes" class="nav-btn">Lentes</button>
    <mat-menu #menuLentes="matMenu">
      <button mat-menu-item routerLink="/lentes/listar">Listar</button>
      <button mat-menu-item routerLink="/lentes/insertar">Insertar</button>
    </mat-menu>

    <button mat-button [matMenuTriggerFor]="menuDetalles" class="nav-btn">Detalles</button>
    <mat-menu #menuDetalles="matMenu">
      <button mat-menu-item routerLink="/detalles/listar">Listar</button>
      <button mat-menu-item routerLink="/detalles/insertar">Insertar</button>
    </mat-menu>

    <button mat-button [matMenuTriggerFor]="menuApis" class="nav-btn">Apis</button>
    <mat-menu #menuApis="matMenu" class="optic-menu">
      <button mat-menu-item routerLink="/apis/productos">Api productos</button>
      <button mat-menu-item routerLink="/apis/chat">Consultar con agente</button>
    </mat-menu>

    <button mat-button [matMenuTriggerFor]="menuReport" class="nav-btn accent-btn">Reportes</button>
    <mat-menu #menuReport="matMenu" class="optic-menu">
      <button mat-menu-item routerLink="/reportes/reportecitas">Reporte Citas</button>
      <button mat-menu-item routerLink="/reportes/reporteintervenciones">Reporte Intervenciones</button>
      <button mat-menu-item routerLink="/reportes/reportetratamientos">Reporte Tratamientos</button>

    </mat-menu>
    @if (username) {
      <span class="user-info"
        ><mat-icon>perm_identity</mat-icon> {{ username }}
        <span class="role">Roles: {{ roles }}</span>
      </span>

      <button matButton [matMenuTriggerFor]="menuCerrar" style="color: aliceblue">
        Cerrar Sesión
      </button>
      <mat-menu #menuCerrar="matMenu">
        <button matButton type="button" (click)="cerrarSesion()">
          <mat-icon>power_settings_new</mat-icon>Salir
        </button>
      </mat-menu>
    }
  </div>
</div>
