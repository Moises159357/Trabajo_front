<div class="optic-navbar">
  <div class="brand-area" routerLink="/home">
    <mat-icon fontIcon="visibility" class="brand-icon"></mat-icon>
    <div class="brand-text">
      <span class="brand-title">OpticVision</span>
      <span class="brand-sub">SALUD VISUAL</span>
    </div>
  </div>

  <div class="nav-links">
    <button mat-button routerLink="/" class="nav-btn home-btn">
      <mat-icon fontIcon="home"></mat-icon>
      <span>Inicio</span>
    </button>

    <button mat-button [matMenuTriggerFor]="menuCitas" class="nav-btn">Citas</button>
    <mat-menu #menuCitas="matMenu" class="optic-menu">
      <button mat-menu-item routerLink="/citas/listar">Listar</button>
      <button mat-menu-item routerLink="/citas/insertar">Insertar</button>
      <button mat-menu-item routerLink="/citas/buscar">Buscar</button>
    </mat-menu>

    <button mat-button [matMenuTriggerFor]="menuPaciente" class="nav-btn">Paciente</button>
    <mat-menu #menuPaciente="matMenu" class="optic-menu">
      <button mat-menu-item routerLink="/paciente/listar">Listar</button>
      <button mat-menu-item routerLink="/paciente/insertar">Insertar</button>
    </mat-menu>

    <button mat-button [matMenuTriggerFor]="menuOftalmologo" class="nav-btn">Oftalmólogo</button>
    <mat-menu #menuOftalmologo="matMenu" class="optic-menu">
      <button mat-menu-item routerLink="/oftalmologo/listar">Listar</button>
      <button mat-menu-item routerLink="/oftalmologo/insertar">Insertar</button>
    </mat-menu>

    <button mat-button [matMenuTriggerFor]="menuApis" class="nav-btn">Apis</button>
    <mat-menu #menuApis="matMenu" class="optic-menu">
      <button mat-menu-item routerLink="/apis/productos">Api productos</button>
    </mat-menu>

    <button mat-button [matMenuTriggerFor]="menuReport" class="nav-btn accent-btn">Reportes</button>
    <mat-menu #menuReport="matMenu" class="optic-menu">
      <button mat-menu-item routerLink="/reportes/reportecitas">Reporte citas</button>
    </mat-menu>
  </div>
</div>
