<div class="login-card">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="brand-header">
      <span class="brand-badge">👁️</span>
      <span class="brand-name">Optic<span>Vision</span></span>
      <span class="brand-sub">SALUD VISUAL ZERO-PAPEL</span>
    </div>

    <h1>Iniciar sesión</h1>

    <label for="username">Usuario</label>
    <input
      id="username"
      type="text"
      formControlName="username"
      autocomplete="username"
      placeholder="Ej. PCSIRCOB@upc.edu.pe"
    />

    @if (form.controls.username.touched && form.controls.username.invalid) {
      <p class="field-error">*Ingresa tu usuario.</p>
    }

    <label for="password">Contraseña</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      placeholder="••••••••"
    />

    @if (form.controls.password.touched && form.controls.password.invalid) {
      <p class="field-error">*Ingresa tu contraseña.</p>
    }

    @if (errorMessage) {
      <p class="error" role="alert">{{ errorMessage }}</p>
    }

    <button type="submit" [disabled]="form.invalid || submitting">
      {{ submitting ? 'Ingresando…' : 'Ingresar' }}
    </button>

    <!--<a routerLink="/home" class="back-link">&larr; Volver a Inicio</a>-->
  </form>
</div>
