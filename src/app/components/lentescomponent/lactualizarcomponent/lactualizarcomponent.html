<div class="container">
  <h2>Formulario de Actualización de Lentes</h2>
  <form [formGroup]="formLente" (ngSubmit)="actualizarLente()">
    <mat-form-field class="example-full-width">
      <mat-label>Código</mat-label>
      <input matInput type="number" formControlName="idLente" readonly />
    </mat-form-field>
    <mat-form-field class="example-full-width">
      <mat-label>Modelo</mat-label>
      <input matInput formControlName="modelo" />
    </mat-form-field>
    <mat-form-field class="example-full-width">
      <mat-label>Marca</mat-label>
      <input matInput formControlName="marca" />
    </mat-form-field>
    <mat-form-field class="example-full-width">
      <mat-label>Precio</mat-label>
      <input matInput type="number" min="0.01" step="0.01" formControlName="precio" />
    </mat-form-field>
    <button mat-raised-button color="primary" type="submit">Guardar</button>
  </form>
  <p>{{ mensaje }}</p>
</div>
