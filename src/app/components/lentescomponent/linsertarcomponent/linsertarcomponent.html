<div class="container">
  <h2>Registro de Lentes</h2>
  <form [formGroup]="formLente" (ngSubmit)="insertarLente()">
    <mat-form-field class="example-full-width">
      <mat-label>Modelo</mat-label>
      <input matInput placeholder="Modelo del lente" formControlName="modelo" />
    </mat-form-field>
    <mat-form-field class="example-full-width">
      <mat-label>Marca</mat-label>
      <input matInput placeholder="Marca del lente" formControlName="marca" />
    </mat-form-field>
    <mat-form-field class="example-full-width">
      <mat-label>Precio</mat-label>
      <input matInput type="number" min="0.01" step="0.01" formControlName="precio" />
    </mat-form-field>
    <button mat-raised-button color="primary" type="submit">Guardar</button>
  </form>
  <p>{{ mensaje }}</p>
</div>
