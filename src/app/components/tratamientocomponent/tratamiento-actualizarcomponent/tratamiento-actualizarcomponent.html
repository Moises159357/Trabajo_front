
<div class="container">
    <div>
        <h2>Formulario de Actualización de Tratamientos</h2>
    </div>

    <div>
        @if (formTratamiento) {
        <form [formGroup]="formTratamiento" (ngSubmit)="actualizarTratamiento()">

            <!-- CÓDIGO DE TRATAMIENTO -->
            <mat-form-field class="example-full-width">
                <mat-label>Código de Tratamiento</mat-label>
                <input matInput
                    type="number"
                    [value]="idTratamiento"
                    readonly>
            </mat-form-field>
            <br>

            <!-- NOMBRE -->
            <mat-form-field class="example-full-width">
                <mat-label>Nombre del Tratamiento</mat-label>
                <input matInput
                    placeholder="Ingrese el nombre del tratamiento"
                    formControlName="nombre">
            </mat-form-field>
            <br>

            <!-- TIPO -->
            <mat-form-field class="example-full-width">
                <mat-label>Tipo de Tratamiento</mat-label>
                <input matInput
                    placeholder="Ingrese el tipo de tratamiento"
                    formControlName="tipo">
            </mat-form-field>
            <br>

            <!-- DURACIÓN -->
            <mat-form-field class="example-full-width">
                <mat-label>Duración en Días</mat-label>
                <input matInput
                    type="number"
                    min="1"
                    placeholder="Ejemplo: 7"
                    formControlName="duracionDias">
            </mat-form-field>
            <br>

            <!-- ESTADO -->
            <mat-form-field class="example-full-width">
                <mat-label>Estado del Tratamiento</mat-label>
                <input matInput
                    placeholder="Ingrese el estado"
                    formControlName="estado">
            </mat-form-field>
            <br>

            <!-- FECHA DE REGISTRO -->
            <mat-form-field class="example-full-width">
                <mat-label>Fecha de Registro</mat-label>
                <input matInput
                    [matDatepicker]="picker"
                    formControlName="fechaRegistro"
                    (focus)="picker.open()"
                    readonly>

                <mat-hint>MM/DD/YYYY</mat-hint>

                <mat-datepicker-toggle matIconSuffix [for]="picker">
                </mat-datepicker-toggle>

                <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
            <br>

            <!-- INDICACIONES -->
            <mat-form-field class="example-full-width">
                <mat-label>Indicaciones</mat-label>
                <textarea matInput
                    placeholder="Ingrese las indicaciones del tratamiento"
                    formControlName="indicaciones"></textarea>
            </mat-form-field>
            <br>

            <!-- BOTÓN GUARDAR -->
            <button matButton
                type="submit"
                [disabled]="cargando || guardando">
                Guardar
            </button>

        </form>
        }

        <!-- MENSAJE DE CARGA -->
        @if (cargando) {
            <p>Cargando tratamiento...</p>
        }

        <!-- MENSAJE DE RESULTADO -->
        @if (mensaje) {
            <p>{{ mensaje }}</p>
        }

    </div>
</div>
